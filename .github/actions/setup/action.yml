name: setup
description: Install pnpm, Node and the locked dependencies.

# Shared by ci.yml and release.yml, so the Node version and the install flags
# cannot drift apart between them (#72).

inputs:
  node-version:
    description: Node version for actions/setup-node.
    required: false
    default: '22'
  cache:
    description: >-
      Whether to restore and save the pnpm store cache. release.yml passes
      false: a release must not restore anything another workflow run wrote.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
        package-manager-cache: ${{ inputs.cache == 'true' }}

    - run: pnpm install --frozen-lockfile
      shell: bash
