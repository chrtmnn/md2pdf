name: release

# Publishes @chrtmnn/md2pdf to npm when a v* tag on main is pushed (#56).
#
# `verify` builds, tests and packs the tarball, then uploads it and records its
# SHA-256 *before* the smoke test runs: that test's global npm install resolves
# dependencies freshly and runs their install scripts, so it must not get a
# chance to swap the tarball that is published. `publish` checks the digest and
# uploads exactly that tarball. It installs no dependencies and runs no package
# scripts, so the one job holding the OIDC token executes nothing from the
# registry. It authenticates through npm Trusted Publishing — there is no npm
# token in this repository — and runs in the `npm` environment, whose
# protection rules (required reviewer, v* tags only) are configured in the
# repository settings.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tarball-sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the tagged commit can be checked against main.
          fetch-depth: 0

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json"
            exit 1
          fi

      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi

      # The tag checks above run before anything is installed. No dependency
      # cache: a release must not restore anything another workflow run wrote.
      - uses: ./.github/actions/setup
        with:
          cache: false

      - run: pnpm audit --audit-level critical

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      - name: Check the package contents
        id: pack
        run: node scripts/pack-check.mjs "$RUNNER_TEMP/pack"

      - name: Record the tarball digest
        id: digest
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: echo "sha256=$(sha256sum "$TARBALL" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

      - name: Allow Chromium's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install the tarball and convert a document
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node scripts/package-smoke.mjs "$TARBALL"

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/package

      - name: Check the tarball digest
        env:
          TARBALL_SHA256: ${{ needs.verify.outputs.tarball-sha256 }}
        run: |
          shopt -s nullglob
          tarballs=("$RUNNER_TEMP"/package/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one tarball, found ${#tarballs[@]}"
            exit 1
          fi
          echo "$TARBALL_SHA256  ${tarballs[0]}" | sha256sum --check --strict

      # Node 24 ships an npm CLI with Trusted Publishing support. No cache, as
      # in verify: setup-node would otherwise enable one on its own.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require an npm CLI with Trusted Publishing
        run: |
          version="$(npm --version)"
          if ! printf '%s\n' 11.5.1 "$version" | sort -V -C; then
            echo "::error::npm $version cannot use Trusted Publishing; 11.5.1 or later is required"
            exit 1
          fi

      - name: Publish with provenance
        run: npm publish "$RUNNER_TEMP"/package/*.tgz --provenance --access public
